name: Check public package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - run: python -X utf8 scripts/check_package.py

  quality:
    name: Python regression and LaTeX build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install numpy==2.2.6 matplotlib==3.10.5 ruff==0.11.13
      - name: Lint maintained Python
        run: python -m ruff check --select E9,F63,F7,F82 scripts tests examples .agents/skills/mcm-fast/scripts
      - name: Check website JavaScript
        run: node --check docs/site.js
      - name: Test monthly forecasting
        run: python -X utf8 -m unittest discover -s tests
      - name: Install pinned Tectonic
        shell: bash
        run: |
          archive="$RUNNER_TEMP/tectonic.tar.gz"
          curl -fsSL --retry 3 -o "$archive" https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' 8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7 "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" tectonic
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build and verify LaTeX examples
        run: python -X utf8 scripts/check_package.py --compile-latex
